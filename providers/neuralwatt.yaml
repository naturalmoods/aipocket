id: neuralwatt
name: Neuralwatt
status: undocumented
console: https://portal.neuralwatt.com/
docs: https://portal.neuralwatt.com/docs/api/overview
notes: >-
  checked 2026-08-18: /v1/quota is documented as returning "account balance, usage
  and limits", but the response schema still is not published — the documentation
  names the endpoint and the word balance, and none of the field names. So the
  status stays undocumented and the figure stays out of the verified total, even
  though the reading now works: official means the provider documents the field,
  not that AIPocket managed to find it.

  The path is no longer a guess. This manifest previously listed four candidates,
  none of which resolved against a live account — one of them, `$.balance`, turned
  out to name an object, so the run reported a schema mismatch instead of a number,
  which is the behaviour that caught this. The real field is
  balance.credits_remaining_usd, confirmed against a live response on 2026-08-18 —
  and against the portal on the same day, which is the comparison CONTRIBUTING asks
  for before an inferred reading is trusted. They agreed, with one wrinkle worth
  knowing: the portal rounds to two decimals for display where the API returns
  three, so a difference in the last decimal is the console rounding and not a
  different field. Its name states the currency.

  One candidate only, deliberately. The same object carries total_credits_usd,
  credits_used_usd, legacy_credits_usd and new_credits_usd next to an
  accounting_method field, so the neighbours are not interchangeable with the
  remaining balance: a fallback would quietly report a different quantity if this
  field were ever renamed. A visible error is the better outcome.

auth:
  type: bearer
  env: NEURALWATT_API_KEY

balance:
  url: https://api.neuralwatt.com/v1/quota
  amounts:
    - path: $.balance.credits_remaining_usd
      currency: USD
